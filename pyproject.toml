[project]
name = "gnss-workbench"
version = "0.2.0"
description = "Reproducible GPS positioning and explainable fault diagnosis"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "typer>=0.15,<1",
]

[project.scripts]
gnss = "gnss_workbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnss_workbench"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyright>=1.1,<2"]
research = [
    "gnss-lib-py==1.1.0",
    "reportlab>=4.4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures", "runtime", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
